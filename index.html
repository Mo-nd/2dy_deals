<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>متجر العروض</title>

  <style>
    body{font-family:sans-serif;background:#f2f2f2;padding:20px}
    h1{text-align:center}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;margin-top:20px}
    .card{background:white;padding:10px;border-radius:10px;text-align:center}
    img{width:100%;height:140px;object-fit:contain}
    button{background:black;color:white;border:none;padding:8px;width:100%;border-radius:6px;margin-top:5px}
  </style>
</head>

<body>

<h1>🔥 أفضل العروض</h1>

<div class="grid" id="products"></div>

<script>
fetch("products.json")
.then(r => r.json())
.then(data => {
  const container = document.getElementById("products");
  data.forEach(p => {
    container.innerHTML += `
      <div class="card">
        <img src="${p.image}">
        <div>${p.title}</div>
        <div><b>${p.price}</b></div>
        <a href="${p.link}" target="_blank">
          <button>اشتري الآن</button>
        </a>
      </div>
    `;
  });
});
</script>

</body>
</html>
