<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مدونة كاتب سعودي</title>
  <style>
    body {
      margin: 0;
      font-family: "Tahoma", sans-serif;
      background: #f7f7f7;
      color: #222;
      line-height: 1.8;
    }
    header {
      text-align: center;
      padding: 60px 20px 30px;
    }
    header h1 {
      margin-bottom: 10px;
    }
    .profile {
      display: flex;
      justify-content: center;
      margin: 30px 0;
    }
    .profile img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    .bio {
      max-width: 700px;
      margin: auto;
      text-align: center;
      padding: 0 20px;
    }
    nav {
      margin: 40px 0;
      text-align: center;
    }
    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: white;
      background: #1f2937;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
    }
    footer {
      text-align: center;
      padding: 30px;
      margin-top: 40px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <h1>مدونة كاتب سعودي</h1>
    <p>تأملات في الفكر والأدب والمجتمع</p>
  </header>

  <div class="profile">
    <img src="profile.jpg" alt="صورة الكاتب">
  </div>

  <div class="bio">
    <p>
      أكتب لأفهم العالم من حولي، وأحاول أن ألتقط تفاصيل الحياة اليومية
      وأسئلة الهوية والتحولات الاجتماعية بعيون سعودية.
      هنا تجد المقالات، مراجعات الكتب، واليوميات الفكرية.
    </p>
  </div>

  <nav>
    <a href="#">مقالات فكرية</a>
    <a href="#">مراجعات كتب</a>
    <a href="#">يوميات</a>
    <a href="#">المجتمع</a>
  </nav>

  <footer>
    © 2026 جميع الحقوق محفوظة
  </footer>

</body>
</html>
