<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محمد الحربي | كاتب سعودي</link>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body{
      font-family:'Tajawal',sans-serif;
      background:#0f172a;
      color:white;
    }

    /* NAV */
    .navbar{
      position:fixed;
      top:0;
      width:100%;
      padding:20px 40px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:rgba(15,23,42,0.9);
      backdrop-filter:blur(10px);
      z-index:1000;
    }

    .logo{
      font-weight:900;
      font-size:20px;
    }

    .nav-links a{
      color:white;
      text-decoration:none;
      margin-left:18px;
      font-size:14px;
      transition:.3s;
    }

    .nav-links a:hover{
      color:#f97316;
    }

    /* HERO */
    .hero{
      min-height:100vh;
      display:flex;
      align-items:center;
      padding:120px 8% 60px;
    }

    .hero-container{
      width:100%;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:60px;
      align-items:center;
    }

    .hero-title{
      font-size:60px;
      font-weight:900;
      line-height:1.1;
      margin-bottom:20px;
    }

    .hero-title span{
      color:#f97316;
    }

    .hero-description{
      color:#cbd5e1;
      line-height:2;
      margin-bottom:30px;
      font-size:16px;
    }

    .buttons{
      display:flex;
      gap:15px;
    }

    .btn{
      padding:12px 22px;
      border-radius:8px;
      text-decoration:none;
      font-weight:700;
      font-size:14px;
    }

    .btn-primary{
      background:#f97316;
      color:white;
    }

    .btn-primary:hover{
      background:#ea580c;
    }

    .btn-outline{
      border:2px solid rgba(255,255,255,0.2);
      color:white;
    }

    .btn-outline:hover{
      border-color:white;
      background:rgba(255,255,255,0.05);
    }

    /* IMAGE */
    .image-wrapper{
      position:relative;
      width:420px;
      height:520px;
      margin:auto;
    }

    .image-bg{
      position:absolute;
      top:20px;
      right:20px;
      width:100%;
      height:100%;
      background:linear-gradient(135deg,#f97316,#ea580c);
      border-radius:220px 220px 40px 40px;
    }

    .image-wrapper img{
      position:relative;
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:220px 220px 40px 40px;
      z-index:2;
    }

    /* MOBILE */
    @media(max-width:900px){
      .hero-container{
        grid-template-columns:1fr;
        text-align:center;
      }
      .hero-title{ font-size:40px; }
      .buttons{ justify-content:center; }
      .image-wrapper{
        width:260px;
        height:340px;
      }
    }

  </style>
</head>

<body>

  <nav class="navbar">
    <div class="logo">محمد الحربي</div>
    <div class="nav-links">
      <a href="#">الرئيسية</a>
      <a href="#">المدونة</a>
      <a href="#">الكتب</a>
      <a href="#">نبذة عني</a>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-container">

      <div class="hero-content">
        <h1 class="hero-title">
          محمد <br>
          <span>الحربي</span>
        </h1>

        <p class="hero-description">
          كاتب سعودي مهتم بالفكر، الأدب، والمجتمع. أسعى من خلال هذه المدونة
          إلى توثيق التأملات اليومية، مشاركة مراجعات الكتب، وكتابة مقالات
          تعكس رؤيتي للواقع المحلي والعالمي من منظور سعودي أصيل.
        </p>

        <div class="buttons">
          <a href="#" class="btn btn-primary">اقرأ المدونة</a>
          <a href="#" class="btn btn-outline">تواصل معي</a>
        </div>
      </div>

      <div class="hero-image">
        <div class="image-wrapper">
          <div class="image-bg"></div>
          <img src="images/profile.png" alt="صورة الكاتب">
        </div>
      </div>

    </div>
  </section>

</body>
</html>
