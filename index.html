<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محمد الحربي</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #0b1220;
      color: white;
    }

    /* ===== NAV ===== */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
    }

    .nav .links a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-size: 14px;
    }

    .nav .links a.active {
      background: #ff6a00;
      padding: 8px 14px;
      border-radius: 6px;
    }

    /* ===== HERO ===== */
    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 40px 8%;
    }

    .hero-text {
      max-width: 600px;
    }

    .hero-text h1 {
      font-size: 48px;
      margin: 0 0 10px;
    }

    .hero-text h1 span {
      color: #ff6a00;
    }

    .hero-text p {
      color: #d1d5db;
      margin-bottom: 25px;
      font-size: 16px;
    }

    .buttons a {
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 8px;
      margin-left: 10px;
      font-size: 14px;
    }

    .btn-primary {
      background: #ff6a00;
      color: white;
    }

    .btn-secondary {
      background: white;
      color: #111;
    }

    /* ===== IMAGE ===== */
    .hero-image img {
      width: 340px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    /* ===== MOBILE ===== */
    @media (max-width: 900px) {
      .hero {
        flex-direction: column-reverse;
        text-align: center;
      }
      .hero-image img {
        width: 220px;
        margin-bottom: 20px;
      }
    }

  </style>
</head>

<body>

  <div class="nav">
    <div class="logo">محمد الحربي</div>
    <div class="links">
      <a class="active" href="#">الرئيسية</a>
      <a href="#">المدونة</a>
      <a href="#">قراءات ومراجعات</a>
      <a href="#">نبذة عني</a>
    </div>
  </div>

  <section class="hero">
    <div class="hero-text">
      <h1>سلمان <span>الدوسري</span></h1>
      <p>
        كاتب سعودي مهتم بالفكر، الأدب، والمجتمع.  
        أسعى من خلال هذه المدونة إلى توثيق التأملات اليومية،
        مشاركة مراجعات الكتب، وكتابة مقالات تعكس رؤيتي
        للواقع المحلي والعالمي من منظور سعودي أصيل.
      </p>

      <div class="buttons">
        <a href="#" class="btn-primary">اقرأ المدونة</a>
        <a href="#" class="btn-secondary">تواصل معي</a>
      </div>
    </div>

    <div class="hero-image">
      <img src="profile.png" alt="صورة الكاتب">
    </div>
  </section>

</body>
</html>
